<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Evolutionary Tree</title>
    <style>
        :root {
            --primary-blue: #3a7ac0; /* A vibrant but dark blue for buttons */
            --dark-blue: #1b4332;
            --panel-bg: rgba(26, 58, 90, 0.9); /* Darker, translucent blue for popups */
            --correct-green: #2d6a4f;
            --accent-gold: #ffd700;
            --wrong-red: #bc4749;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Dark background for the intro animation */
            background: #0a1a2a;
            background-size: cover;
            color: white; /* Keep text white for contrast */
            line-height: 1.6;
            width: 100vw;
            min-height: 100vh;
            overflow: hidden;
            overscroll-behavior: none; /* Prevents Mac trackpad swipe-to-go-back gestures */
            position: relative;
            transition: background 2s ease-in-out; /* Smooth transition for background change */
        }

        #background-tree-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 1.5s ease;
        }

        #popup-media-container {
            width: 100%;
            margin-bottom: 20px;
            display: none;
        }

        #popup-audio {
            width: 100%;
            margin-bottom: 20px;
            display: none;
            outline: none;
        }

        #intro-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
        }
        #intro-video-container.active {
            opacity: 1;
            visibility: visible;
        }
        #intro-video {
            width: 80%;
            max-height: 70vh;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .bg-branch {
            stroke: rgba(255, 255, 255, 0.2);
            stroke-linecap: round;
            fill: none;
            transition: opacity 2s ease;
        }

        @keyframes grow-bg {
            from { stroke-dashoffset: 1; }
            to { stroke-dashoffset: 0; }
        }

        #background-tree-animation.hidden {
            opacity: 0;
        }

        #tree-canvas {
            width: 100vw;
            height: 100vh;
            opacity: 0; /* Initially hidden */
            transition: opacity 2s ease-in-out; /* Fade in the tree */
        }

        #tree-canvas.active {
            opacity: 1;
        }

        .node-group {
            cursor: pointer;
        }

        .node-group.inactive {
            cursor: default;
        }

        /* Branch drawing animation */
        .branch-line {
            stroke: white;
            fill: none;
            stroke-linecap: round;
            animation: grow 0.8s ease-out forwards;
            pointer-events: all; /* Ensures reliable mouse detection */
            transition: var(--transition);
        }

        @keyframes grow {
            to { stroke-dashoffset: 0; }
        }

        .node-circle {
            fill: white;
            stroke-width: 2;
            opacity: 0;
            animation: fadeIn 0.4s 0.8s forwards; /* Fades in after line grows */
            transition: var(--transition), transform 0.5s ease-out, opacity 0.5s ease-out;
            pointer-events: all;
        }

        .node-group:not(.inactive):hover .branch-line {
            stroke: var(--accent-gold);
            stroke-width: 14; /* Increased from 6 to prevent the 'shaky' hover flicker */
        }

        .node-group:not(.inactive):hover .node-circle {
            fill: var(--accent-gold);
            stroke: white;
            stroke-width: 3;
            opacity: 1 !important; /* Force visibility on hover even if animation hasn't finished */
        }

        /* Styles for passed stages (The Ancestral Path) */
        .node-group.inactive .branch-line {
            stroke: #1a1a1a; /* Dark charcoal */
            stroke-width: 4;
        }

        .node-group.inactive .node-circle {
            fill: #1a1a1a;
        }

        /* Specific styling for the incorrect dead-ends */
        .node-group.inactive.incorrect-path .node-circle {
            rx: 0; /* Turn circle into a block */
            fill: #050505;
            width: 20px;
            height: 20px;
            transform: translate(5px, 5px); /* Re-center smaller block */
        }

        .branch-label.incorrect-path {
            display: none; 
        }

        .branch-label.inactive:not(.incorrect-path) {
            fill: var(--accent-gold);
            opacity: 0.8;
            transform: translateY(90px); /* Moves label from y-40 to y+50 */
        }

        .branch-date {
            fill: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            font-weight: 400;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease-out, transform 1s ease-out;
            transform: translateY(20px);
        }

        .branch-date.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Keep the correct path taken highly visible (The Golden Lineage) */
        .node-group.inactive:not(.incorrect-path) .branch-line {
            stroke: var(--accent-gold);
            stroke-width: 8;
            opacity: 0.7; /* Slightly faded compared to current active stage */
        }

        .node-group.inactive:not(.incorrect-path) .node-circle {
            fill: var(--accent-gold);
            opacity: 0.7;
        }

        .branch-label {
            fill: white;
            font-size: 26px;
            font-weight: 600;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            opacity: 0;
            animation: fadeIn 0.4s 0.8s forwards; /* Fades in with the nodes */
            transition: var(--transition), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease-out;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        #camera {
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .overlay-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 10;
            pointer-events: all;
            text-align: center;
            transition: opacity 1s ease-out, visibility 1s;
        }

        .overlay-ui.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .overlay-ui h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #start-button {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #start-button:hover {
            background-color: #4a90e2;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        #go-back-btn {
            position: fixed;
            bottom: 40px;
            left: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: all; /* Make it clickable */
            transition: var(--transition);
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: none;
        }
        #go-back-btn:hover { 
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* Central Popup Styles */
        #central-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg); /* Use new darker panel background */
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 750px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto; /* Allows scrolling inside the popup if the content is too tall */
            text-align: center;
            color: white;
            z-index: 101; /* Above overlay-ui */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none; /* Initially non-interactive */
        }

        #central-popup.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all; /* Interactive when active */
        }

        #central-popup h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: white; /* Ensure title is white */
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        #central-popup p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        #popup-buttons button {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 0 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }
        #popup-buttons button:hover {
            background-color: #4a90e2;
        }
        .status-correct { color: var(--correct-green); }
        .status-wrong { color: var(--wrong-red); }
    </style>
</head>
<body>
    <!-- Background Animation Layer -->
    <svg id="background-tree-animation"></svg>

    <div class="overlay-ui">
        <h1>Human Evolutionary Tree</h1>
        <button id="start-button">Start</button>
    </div>

    <!-- Intro Video Layer -->
    <div id="intro-video-container">
        <div id="intro-video" style="overflow: hidden; background: black;"></div>
        <button id="begin-evolution-btn" style="margin-top: 30px; background-color: var(--primary-blue); color: white; border: none; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Start Evolution</button>
    </div>
    <button id="go-back-btn">Go Back</button>
    <button id="restart-game-btn" style="position: fixed; bottom: 40px; right: 40px; background: var(--primary-blue); color: white; border: none; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; z-index: 10; display: none; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); transition: var(--transition);">Restart Game</button>

    <svg id="tree-canvas" viewBox="0 0 1000 1000">
        <g id="camera">
            <g id="tree-content">
                <!-- Initial start line -->
                <!-- This initial line will be rendered by JS init() for consistency -->
            </g>
            <g id="labels-content"></g>
        </g>
    </svg>

    <!-- Central Popup -->
    <div id="central-popup">
        <h2 id="popup-title"></h2>
        <div id="popup-media-container">
            <!-- Video or Iframe will be injected here -->
        </div>
        <audio id="popup-audio" controls autoplay></audio>
        <p id="popup-content"></p>
        <div id="popup-buttons"></div>
    </div>
    <audio id="bg-music" loop src="desifreemusic-emotional-ambient-piece-with-slow-cinematic-textures-370144.mp3"></audio>

    <script>
        const stages = [
            {
                rootLabel: "Primordial Earth",
                date: "~3.8 Billion Years Ago",

            },

                    { label: "Binary Fission Optimization", correct: false, info: "Optimization alone doesn't lead to complexity; eukaryotes required an energy revolution.", audio: "AP Biology Audio Recordings/Binary Fission Optimization.MP3" },

                ]
            },
            {

                date: "~600 Million Years Ago",
                branches: [

                    { label: "Chitinous Cell Walls", correct: false, info: "Chitinous walls are characteristic of Fungi, not the lineage leading to animals.", audio: "AP Biology Audio Recordings/Chitinous Cell Walls.MP3" },
                    { label: "Cellulose Cell Walls", correct: false, info: "Cellulose is the hallmark of Plants; animals evolved toward flexible, adhesive membranes.", audio: "AP Biology Audio Recordings/Cellulose Cell Walls.MP3" }
                ]
            },
            {
                rootLabel: "The Colonial Shift",
                date: "~530 Million Years Ago",
                branches: [
                    { label: "Triploblastic Cephalization", correct: true, info: "Correct! Developing a front, back, and three tissue layers allowed for complex organs and direction.", video: "Stage Videos/Triploblastic Cephalization.mp4" },
                    { label: "Permanent Radial Symmetry", correct: false, info: "Radial symmetry (like jellyfish) limits complex directional movement and brain development.", audio: "AP Biology Audio Recordings/Permanent Radial Symmetry.MP3" },
                    { label: "Placozoan Asymmetry", correct: false, info: "Asymmetrical forms are simple, but bilateral direction was needed for the human path.", audio: "AP Biology Audio Recordings/Placozoan Asymmetry.MP3" }
                ]
            },
            {
                rootLabel: "Finding a Direction",
                date: "~480 Million Years Ago",
                branches: [
                    { label: "Internal Notochord", correct: true, info: "Correct! This rigid internal rod was the precursor to the backbone and defined the Chordates.", video: "Stage Videos/Internal Notochord.mp4" },
                    { label: "Chitinous Exoskeleton", correct: false, info: "Exoskeletons lead to insects and crabs—a successful path, but not ours.", audio: "AP Biology Audio Recordings/Chitinous Exoskeleton.MP3" },
                    { label: "Calcium Carbonate Shell", correct: false, info: "Shells offer protection for mollusks, but limit the internal complexity required for vertebrates.", audio: "AP Biology Audio Recordings/Calcium Carbonate Shell.MP3" }
                ]
            },
            {
                rootLabel: "The Spinal Scaffold",
                date: "~420 Million Years Ago",
                branches: [
                    { label: "Ossified Vertebral Column", correct: true, info: "Correct! Turning that rod into bone segments protected the nerve cord and allowed for larger bodies.", video: "Stage Videos/Ossified Vertebral Column.mp4" },
                    { label: "Unprotected Nerve Highway", correct: false, info: "Without a column, the nervous system is too vulnerable to survive in larger organisms.", audio: "AP Biology Audio Recordings/Unprotected Nerve Highway.MP3" },

                ]
            },
            {
                rootLabel: "Upgrading to Bone",
                date: "~390 Million Years Ago",
                branches: [
                    { label: "Sarcopterygii Bone Core", correct: true, info: "Correct! Lobe-finned fish had internal bones in their fins that eventually became our limbs.", video: "Stage Videos/Sarcopterygii Bone Core.mp4" },
                    { label: "Actinopterygii Ray Fins", correct: false, info: "Ray fins are great for swimming, but they lack the bone structure to support weight on land.", audio: "AP Biology Audio Recordings/Actinopterygii Ray Fins.MP3" },

            {
                rootLabel: "Heavy Lifting Fins",
                date: "~365 Million Years Ago",
                branches: [
                    { label: "Dactylous Walking Limbs", correct: true, info: "Correct! The evolution of fingers and toes allowed the first tetrapods to conquer the land.", video: "Stage Videos/Dactylous Walking Limbs.mp4" },
                    { label: "Pelvic Fin Flapping", correct: false, info: "Simply flapping fins isn't enough to walk; distinct skeletal joints were required.", audio: "AP Biology Audio Recordings/Pelvic Fin Flapping.MP3" },
                    { label: "Apodal Slithering", correct: false, info: "Losing limbs is a specialized adaptation for some, but our path required the development of limbs.", audio: "AP Biology Audio Recordings/Apodal Slithering.MP3" }
                ]
            },
            {
                rootLabel: "Breaching the Surface",
                date: "~312 Million Years Ago",
                branches: [

                    { label: "Gelatinous Water Eggs", correct: false, info: "Amphibian-style eggs must stay in water, tying life to the coastlines.", audio: "AP Biology Audio Recordings/Gelatinous Water Eggs.MP3" },

            {
                rootLabel: "Leaving the Coastlines",

            "Binocular Vision & Flat Nails.mp4": { url: "https://streamable.com/e/39wwtn?autoplay=1&loop=0", padding: "56.250%" },
            "Bipedal Pelvis Rotation.mp4": { url: "https://streamable.com/e/tgi19p?autoplay=1&loop=0", padding: "56.250%" },
            "Opposable Thumb Precision.mp4": { url: "https://streamable.com/e/tazob4?autoplay=1&loop=0", padding: "56.250%" },
            "Metabolic Gut Reduction.mp4": { url: "https://streamable.com/e/zx9g7n?autoplay=1&loop=0", padding: "56.250%" },
            "Symbolic Culture & Encephalization.mp4": { url: "https://streamable.com/e/og6ex8?autoplay=1&loop=0", padding: "56.250%" },
            "StartScreen.mp4": { url: "https://streamable.com/e/0cfs4o?autoplay=1&loop=0&nocontrols=1", padding: "56.250%" }
        };

        function getVideoHtml(filename) {
            const cleanName = filename.split('/').pop();
            const config = streamableLinks[cleanName];
            if (config) {
                return `<div style="position:relative; width:100%; height:0px; padding-bottom:${config.padding}"><iframe allow="fullscreen;autoplay" allowfullscreen height="100%" src="${config.url}" width="100%" style="border:none; width:100%; height:100%; position:absolute; left:0px; top:0px; overflow:hidden; border-radius: 10px;"></iframe></div>`;
            }
            return `<video id="popup-video" controls autoplay muted playsinline style="width: 100%; max-height: 50vh; object-fit: contain; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"><source src="${filename}" type="video/mp4"></video>`;
        }

        function getAudioUrl(filename) {
            if (!filename) return "";
            // Use encodeURI to handle spaces correctly for the web.
            // GitHub Pages is case-sensitive, so we use the path exactly as defined in 'stages'.
            return encodeURI(filename);
        }

        let currentStageIndex = 0;
        let historyStack = []; // Stores { forkGroupId, cameraTransform, nodeCoords, stageIndex } for previous *correct* steps
        let isPopupActive = false;
        let lastCameraTransform = 'translate(0, 0) scale(1)';
        let currentScale = 1;
        let lastCorrectNodeCoords = { x: 500, y: 800 };
        const treeContent = document.getElementById('tree-content');
        const labelsContent = document.getElementById('labels-content');
        const camera = document.getElementById('camera');

        function renderFork(startX, startY, stageIdx) {
            const stage = stages[stageIdx];
            if (!stage) return;

            const forkHeight = 600; // Increased for larger screen coverage
            const spread = 500;      // Wider spread

            // Define target positions based on startX and startY
            const targetPositions = {
                'left': { x: startX - spread, y: startY - forkHeight },
                'middle': { x: startX, y: startY - forkHeight },
                'right': { x: startX + spread, y: startY - forkHeight }
            };

            stage.branches.forEach((branch) => {
                const pos = targetPositions[branch.position];
                if (!pos) {
                    console.error(`Invalid position '${branch.position}' for branch: ${branch.label}`);
                    return;
                }
                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute("class", "node-group");
                group.setAttribute("data-stage", stageIdx);
                group.setAttribute("data-correct", branch.correct);
                
                group.addEventListener('click', () => {
                    handleChoice(branch, pos.x, pos.y, stageIdx);
                });

                group.innerHTML = `
                    <line class="branch-line" x1="${startX}" y1="${startY}" x2="${pos.x}" y2="${pos.y}" stroke-width="10" />
                    <rect class="node-circle" x="${pos.x - 15}" y="${pos.y - 15}" width="30" height="30" rx="15" />
                `;
                const lineElement = group.querySelector('.branch-line');
                const lineLength = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                lineElement.setAttribute("stroke-dasharray", lineLength);
                lineElement.setAttribute("stroke-dashoffset", lineLength); // Start hidden for initial growth
                lineElement.style.animation = `grow 0.8s ease-out forwards`; // Faster growth
                treeContent.appendChild(group);

                // Create label in the separate label layer so it stays on top of all lines
                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("class", "branch-label");
                label.setAttribute("x", pos.x);
                label.setAttribute("y", pos.y - 40); // Initial position at the top
                label.setAttribute("text-anchor", "middle");
                label.setAttribute("data-stage", stageIdx);
                label.setAttribute("data-correct", branch.correct);
                label.textContent = branch.label;
                labelsContent.appendChild(label);

                // Create date label (only for correct branch)
                if (branch.correct) {
                    const date = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    date.setAttribute("class", "branch-date");
                    date.setAttribute("x", pos.x);
                    date.setAttribute("y", pos.y + 85);
                    date.setAttribute("text-anchor", "middle");
                    date.setAttribute("data-stage", stageIdx);
                    date.setAttribute("data-correct", "true");
                    date.textContent = stage.date;
                    labelsContent.appendChild(date);
                }
            });
        }

        function handleChoice(branch, x, y, stageIdx) {
            // Store current state before potential update for 'Go Back' from popup
            const prevStageIndex = currentStageIndex;
            const prevLastCorrectNodeCoords = { ...lastCorrectNodeCoords };

            if (isPopupActive || stageIdx !== currentStageIndex) return;
            isPopupActive = true;
            updateGoBackButtonVisibility();

            // Store the current camera transform (which centers the root of the current fork)
            lastCameraTransform = camera.style.transform;

            // Calculate zoom-in transform: center the clicked node and scale
            const zoomFactor = 2; // How much to zoom in
            setCameraTransform(500 - x * zoomFactor, 500 - y * zoomFactor, zoomFactor, true, false);

            // Show the central popup
            const isFinal = (branch.correct && stageIdx === stages.length - 1);
            const mediaPath = branch.correct ? branch.video : branch.audio;
            showCentralPopup(branch.correct ? "Correct Choice!" : "Incorrect Path!", branch.info, branch.correct, mediaPath, isFinal, prevStageIndex, prevLastCorrectNodeCoords);

            // Store info needed for 'Move On'
            if (branch.correct) {
                historyStack.push({
                    cameraTransform: lastCameraTransform,
                    nodeCoords: { ...lastCorrectNodeCoords },
                    stageIndex: currentStageIndex
                });
                lastCorrectNodeCoords = { x: x, y: y };
                currentStageIndex = stageIdx + 1; // Update currentStageIndex only if correct
            }
        }

        function showCentralPopup(title, content, isCorrect, mediaPath, isFinal = false, prevStageIndex = 0, prevNodeCoords = {x:0, y:0}) {
            const popup = document.getElementById('central-popup');
            const popupTitle = document.getElementById('popup-title');
            const popupContent = document.getElementById('popup-content');
            const popupButtons = document.getElementById('popup-buttons');
            const mediaContainer = document.getElementById('popup-media-container');
            const popupAudio = document.getElementById('popup-audio');
            const bgMusic = document.getElementById('bg-music');

            popupTitle.innerHTML = title;
            popupContent.innerText = content;
            popupButtons.innerHTML = ''; // Clear previous buttons

            // Reset and Handle Media Logic
            mediaContainer.style.display = 'none';
            mediaContainer.innerHTML = '';
            popupAudio.style.display = 'none';
            popupAudio.pause();
            popupAudio.src = "";

            // Duck background music volume for popup media
            bgMusic.volume = 0.05;

            if (mediaPath) {
                if (mediaPath.toLowerCase().endsWith('.mp4')) {
                    mediaContainer.style.display = 'block';
                    mediaContainer.innerHTML = getVideoHtml(mediaPath);
                } else {
                    popupAudio.src = getAudioUrl(mediaPath);
                    popupAudio.style.display = 'block';
                    popupAudio.load();
                    popupAudio.play().catch(e => console.log("Audio autoplay blocked"));
                }
            }

            const goBackButton = document.createElement('button');
            goBackButton.innerText = "Go Back";
            goBackButton.onclick = (e) => {
                if (e) e.stopPropagation();
                zoomOutAndContinue(false, prevStageIndex, prevNodeCoords);
            };
            popupButtons.appendChild(goBackButton);

            if (isCorrect && !isFinal) {
                const moveOnButton = document.createElement('button');
                moveOnButton.innerText = "Move On";
                moveOnButton.onclick = (e) => {
                    if (e) e.stopPropagation();
                    zoomOutAndContinue(true, prevStageIndex, prevNodeCoords);
                };
                popupButtons.appendChild(moveOnButton);
            } else if (!isCorrect) {
                // For incorrect, allow clicking anywhere on the popup to dismiss
                popup.onclick = () => zoomOutAndContinue(false, prevStageIndex, prevNodeCoords);
            } else if (isFinal) {
                const continueButton = document.createElement('button');
                continueButton.innerText = "Continue";
                continueButton.onclick = (e) => {
                    if (e) e.stopPropagation();
                    handleFinalContinue();
                };
                popupButtons.appendChild(continueButton);
            }

            popup.classList.add('active');
        }

        function handleFinalContinue() {
            const popup = document.getElementById('central-popup');
            const mediaContainer = document.getElementById('popup-media-container');
            const popupAudio = document.getElementById('popup-audio');
            
            // Stop any playing video or iframe
            mediaContainer.innerHTML = '';
            popupAudio.pause();
            popup.classList.remove('active');
            
            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.15; // Restore volume after popup closes

            // Update states so the final branches turn into the finished lineage style
            updateNodeStates();

            // Zoom out to see about 3-4 stages (scale 0.5)
            const finalZoom = 0.5;
            const tx = 500 - lastCorrectNodeCoords.x * finalZoom;
            const ty = 500 - lastCorrectNodeCoords.y * finalZoom;
            setCameraTransform(tx, ty, finalZoom, true, true); 
            
            // Show restart button
            document.getElementById('restart-game-btn').style.display = 'block';
            
            // Allow panning and interacting with go back button
            isPopupActive = false;
            updateGoBackButtonVisibility();
        }

        function zoomOutAndContinue(proceed, prevStageIndex, prevNodeCoords) {
            const popup = document.getElementById('central-popup');
            const mediaContainer = document.getElementById('popup-media-container');
            const popupAudio = document.getElementById('popup-audio');
            const bgMusic = document.getElementById('bg-music');
            
            // Stop any playing video or iframe
            mediaContainer.innerHTML = '';
            popupAudio.pause(); // Stop audio when closing
            bgMusic.volume = 0.15; // Restore background volume
            popup.classList.remove('active');
            popup.onclick = null; // Remove click handler for incorrect path

            // Zoom out to the state before the current node was clicked
            camera.style.transform = lastCameraTransform;
            syncCameraCoords();

            setTimeout(() => {
                if (proceed) {
                    // If proceeding, hide the overlay UI (title)
                    // This is done here to ensure it only hides on a successful 'Move On'
                    document.querySelector('.overlay-ui').classList.add('hidden');

                    renderFork(lastCorrectNodeCoords.x, lastCorrectNodeCoords.y, currentStageIndex); 

                    const newForkRootX = lastCorrectNodeCoords.x;
                    const newForkRootY = lastCorrectNodeCoords.y;
                    const newOffsetX = 500 - newForkRootX;
                    const newOffsetY = 800 - newForkRootY; // Keep the 'grow upward' perspective

                    // Start the smooth pan to the new fork's root after zoom-out completes
                    setTimeout(() => {
                        setCameraTransform(newOffsetX, newOffsetY, 1);
                        lastCameraTransform = camera.style.transform;
                        updateNodeStates();
                        
                        // IMPORTANT: Keep it locked until the new branches finish growing (0.8s)
                        setTimeout(() => { 
                            isPopupActive = false; 
                            updateGoBackButtonVisibility();
                        }, 800);
                    }, 10);
                }
                else { // User clicked "Go Back" from the central popup
                    // If we are reverting a correct choice before moving on, sync the history stack
                    if (currentStageIndex > prevStageIndex) {
                        historyStack.pop();
                    }
                    currentStageIndex = prevStageIndex;
                    lastCorrectNodeCoords = prevNodeCoords;
                    isPopupActive = false;
                    updateNodeStates();
                    updateGoBackButtonVisibility();
                }
            }, 1200);
        }

        let currentCamX = 0;
        let currentCamY = 0;

        function setCameraTransform(x, y, scale = 1, animate = true, clamp = true) {
            let tx = x;
            let ty = y;

            if (clamp) {
                // Expanded limits for 15 stages: 500 spread * 15 = 7500px potential width
                const spreadLimit = 8000 * scale;
                const minY = 1000 * (1 - scale); // Prevent scrolling under the root, regardless of scale
                const maxY = (800 - lastCorrectNodeCoords.y + 2000) * scale; // Dynamic height based on progress
                
                tx = Math.max(-spreadLimit, Math.min(spreadLimit, x));
                ty = Math.max(minY, Math.min(maxY, y));
            }

            camera.style.transition = animate ? 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)' : 'none';
            camera.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            currentCamX = tx;
            currentCamY = ty;
            currentScale = scale;
        }

        function syncCameraCoords() {
            const match = camera.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
            if (match) {
                currentCamX = parseFloat(match[1]);
                currentCamY = parseFloat(match[2]);
            }
            const scaleMatch = camera.style.transform.match(/scale\(([\d.]+)\)/);
            if (scaleMatch) {
                currentScale = parseFloat(scaleMatch[1]);
            }
        }

        window.addEventListener('wheel', (e) => {
            if (isPopupActive) return;
            currentCamX -= e.deltaX;
            currentCamY -= e.deltaY;
            // Respect currentScale so we don't 'zoom in again' while scrolling
            setCameraTransform(currentCamX, currentCamY, currentScale, false);
            lastCameraTransform = camera.style.transform;
        });

        function updateNodeStates() {
            const updateElement = (el) => {
                const stage = parseInt(el.getAttribute('data-stage'));
                const isCorrect = el.getAttribute('data-correct') === 'true';
                
                if (stage < currentStageIndex) {
                    el.classList.add('inactive');
                    if (!isCorrect) {
                        el.classList.add('incorrect-path');
                    } else {
                        el.classList.remove('incorrect-path');
                    }
                    // Handle date visibility
                    if (el.classList.contains('branch-date') && isCorrect) {
                        el.classList.add('visible');
                    }
                } else {
                    el.classList.remove('inactive', 'incorrect-path');
                    if (el.classList.contains('branch-date')) {
                        el.classList.remove('visible');
                    }
                }
            };

            // Apply logic to both the physical nodes and the labels in their separate layer
            document.querySelectorAll('.node-group').forEach(updateElement);
            document.querySelectorAll('.branch-label').forEach(updateElement);
            document.querySelectorAll('.branch-date').forEach(updateElement);
        }

        function goBack() {
            if (isPopupActive || historyStack.length === 0) return;
            isPopupActive = true; 

            // Hide button immediately so it can't be spammed
            document.getElementById('go-back-btn').style.display = 'none';

            // Hide restart button if it was visible
            document.getElementById('restart-game-btn').style.display = 'none';

            const previousState = historyStack.pop();
            const currentGroups = document.querySelectorAll(`.node-group[data-stage="${currentStageIndex}"]`);
            const currentLabels = document.querySelectorAll(`.branch-label[data-stage="${currentStageIndex}"]`);

            const targetRootX = 500 - lastCorrectNodeCoords.x;
            const targetRootY = 800 - lastCorrectNodeCoords.y;
            const isCentered = Math.abs(currentCamX - targetRootX) < 2 && Math.abs(currentCamY - targetRootY) < 2;

            const startRetraction = () => {
                currentLabels.forEach(el => {
                    el.style.opacity = '1'; 
                    el.style.animation = 'none'; 
                    el.getBoundingClientRect(); 
                    el.style.transition = 'opacity 0.8s ease-out';
                    el.style.opacity = '0';
                });
                currentGroups.forEach(group => {
                    const circle = group.querySelector('.node-circle');
                    if (circle) {
                        circle.style.opacity = '1';
                        circle.style.animation = 'none';
                        circle.getBoundingClientRect(); 
                        circle.style.transition = 'opacity 0.8s ease-out';
                        circle.style.opacity = '0';
                    }
                });

                setTimeout(() => {
                    currentGroups.forEach(group => {
                        const line = group.querySelector('.branch-line');
                        if (line) {
                            const length = line.getAttribute('stroke-dasharray');
                            line.style.animation = 'none';
                            line.style.strokeDashoffset = '0';
                            line.getBoundingClientRect(); 
                            line.style.transition = 'stroke-dashoffset 0.6s linear, opacity 0.6s ease-out';
                            line.style.strokeDashoffset = length;
                            line.style.opacity = '0';
                        }
                    });

                    setTimeout(() => {
                        currentStageIndex = previousState.stageIndex;
                        lastCorrectNodeCoords = previousState.nodeCoords;
                        updateNodeStates();
                        camera.style.transform = previousState.cameraTransform;
                        lastCameraTransform = camera.style.transform;
                        syncCameraCoords();

                        setTimeout(() => {
                            currentGroups.forEach(el => el.remove());
                            currentLabels.forEach(el => el.remove());
                            isPopupActive = false; 
                            updateGoBackButtonVisibility();
                        }, 1200);
                    }, 600);
                }, 800);
            };

            if (isCentered) {
                startRetraction();
            } else {
                setCameraTransform(targetRootX, targetRootY, 1, true, false);
                setTimeout(startRetraction, 800);
            }
        }

        function updateGoBackButtonVisibility() {
            const btn = document.getElementById('go-back-btn');
            btn.style.display = (historyStack.length > 0 && !isPopupActive) ? 'block' : 'none';
        }


        // --- Background Animation Logic ---
        const bgSvg = document.getElementById('background-tree-animation');
        let bgInterval;

        function createBgBranch(x, y, angle, length, depth) {
            if (depth <= 0) return;

            const x2 = x + Math.cos(angle) * length;
            const y2 = y + Math.sin(angle) * length;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x);
            line.setAttribute("y1", y);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke-width", depth * 0.8);
            line.setAttribute("class", "bg-branch");
            
            // Animation setup
            const totalLength = length;
            line.style.strokeDasharray = totalLength;
            line.style.strokeDashoffset = totalLength;
            line.style.animation = `grow ${1 + Math.random() * 2}s ease-out forwards`;
            
            bgSvg.appendChild(line);

            // Branch out
            setTimeout(() => {
                const numBranches = Math.random() > 0.5 ? 2 : 1;
                for (let i = 0; i < numBranches; i++) {
                    const nextAngle = angle + (Math.random() - 0.5) * 1.5;
                    const nextLength = length * (0.6 + Math.random() * 0.3);
                    createBgBranch(x2, y2, nextAngle, nextLength, depth - 1);
                }
            }, 800);

            // Self-destruct old branches to keep performance clean
            setTimeout(() => {
                line.style.opacity = '0';
                setTimeout(() => line.remove(), 2000);
            }, 20000);
        }

        function spawnBgTree() {
            const isTop = Math.random() < 0.4; // 40% chance to grow from the top
            const startX = Math.random() * window.innerWidth;
            const startY = isTop ? -20 : window.innerHeight + 20;
            
            const baseAngle = isTop ? Math.PI / 2 : -Math.PI / 2;
            const angle = baseAngle + (Math.random() - 0.5) * 1.2;
            
            createBgBranch(startX, startY, angle, 100 + Math.random() * 100, 5);
        }

        function initBackgroundAnimation() {
            bgInterval = setInterval(spawnBgTree, 1000); // Spawns every second
            // Initial burst
            for(let i=0; i<10; i++) spawnBgTree();
        }

        function shuffleStages() {
            stages.forEach(stage => {
                const positions = ['left', 'middle', 'right'];
                // Fisher-Yates shuffle
                for (let i = positions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [positions[i], positions[j]] = [positions[j], positions[i]];
                }
                stage.branches.forEach((branch, idx) => {
                    branch.position = positions[idx];
                });
            });
        }

        function startGame() {
            const overlay = document.querySelector('.overlay-ui');
            const introContainer = document.getElementById('intro-video-container');
            const introVideo = document.getElementById('intro-video');
            const bgMusic = document.getElementById('bg-music');

            // Start background music at a very low volume during the intro video
            bgMusic.volume = 0.05;
            bgMusic.play().catch(e => console.log("Audio play blocked until interaction"));

            // Fade out initial UI and show video
            overlay.classList.add('hidden');
            introContainer.classList.add('active');
            introVideo.innerHTML = getVideoHtml("StartScreen.mp4");
        }

        function beginEvolution() {
            const introContainer = document.getElementById('intro-video-container');
            const introVideo = document.getElementById('intro-video');
            const canvas = document.getElementById('tree-canvas');
            const bgAnim = document.getElementById('background-tree-animation');
            const bgMusic = document.getElementById('bg-music');

            // Clear intro video content to stop playback
            introVideo.innerHTML = '';
            introContainer.classList.remove('active');

            // Stop background spawning
            clearInterval(bgInterval);
            shuffleStages(); // Randomize branch positions every time game starts

            bgMusic.volume = 0.15; // Set to normal ambient volume for gameplay
            bgAnim.classList.add('hidden');

            // 2. Transition the background
            document.body.style.background = 'linear-gradient(to bottom right, #0a1a2a, #1a3a5a, #2a5a8a)'; /* Darker gradient */

            // 3. Activate the tree and start growth
            setTimeout(() => {
                canvas.classList.add('active');
                
                camera.style.transform = 'translate(0, 0) scale(1)';
                
                // Render the root line
                const initialLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                initialLine.setAttribute("x1", "500");
                initialLine.setAttribute("y1", "1000");
                initialLine.setAttribute("x2", "500");
                initialLine.setAttribute("y2", "800");
                initialLine.setAttribute("stroke", "white");
                initialLine.setAttribute("stroke-width", "10");
                initialLine.setAttribute("class", "branch-line");
                const initialLineLength = Math.sqrt(Math.pow(500 - 500, 2) + Math.pow(800 - 1000, 2)); // Length is 200
                initialLine.setAttribute("stroke-dasharray", initialLineLength);
                initialLine.setAttribute("stroke-dashoffset", initialLineLength);
                initialLine.style.animation = `grow 0.8s ease-out forwards`; // Match new speed
                treeContent.appendChild(initialLine);

                setTimeout(() => {
                    renderFork(lastCorrectNodeCoords.x, lastCorrectNodeCoords.y, 0);
                    updateGoBackButtonVisibility();
                }, 1500);
            }, 1000);
        }

        function jumpToLastStage() {
            const bgMusic = document.getElementById('bg-music');
            // Ensure music starts if jumping straight from the start screen
            bgMusic.volume = 0.15;
            bgMusic.play().catch(e => console.log("Audio play blocked"));

            shuffleStages();
            clearInterval(bgInterval);
            document.getElementById('background-tree-animation').classList.add('hidden');
            document.body.style.background = 'linear-gradient(to bottom right, #0a1a2a, #1a3a5a, #2a5a8a)';
            document.querySelector('.overlay-ui').classList.add('hidden');
            document.getElementById('intro-video-container').classList.remove('active');
            document.getElementById('tree-canvas').classList.add('active');
            
            treeContent.innerHTML = '';
            labelsContent.innerHTML = '';
            historyStack = [];
            currentStageIndex = 0;
            lastCorrectNodeCoords = { x: 500, y: 800 };
            currentScale = 1;

            // Render initial root
            const initialLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            initialLine.setAttribute("x1", "500");
            initialLine.setAttribute("y1", "1000");
            initialLine.setAttribute("x2", "500");
            initialLine.setAttribute("y2", "800");
            initialLine.setAttribute("stroke", "white");
            initialLine.setAttribute("stroke-width", "10");
            initialLine.setAttribute("class", "branch-line");
            initialLine.setAttribute("stroke-dasharray", "200");
            initialLine.setAttribute("stroke-dashoffset", "0");
            treeContent.appendChild(initialLine);

            // Iterate through all stages except the last one to build the path
            for (let i = 0; i < stages.length - 1; i++) {
                const stage = stages[i];
                const correctBranch = stage.branches.find(b => b.correct);
                renderFork(lastCorrectNodeCoords.x, lastCorrectNodeCoords.y, i);
                
                let nextX = lastCorrectNodeCoords.x;
                if (correctBranch.position === 'left') nextX -= 500;
                else if (correctBranch.position === 'right') nextX += 500;
                let nextY = lastCorrectNodeCoords.y - 600;

                historyStack.push({
                    cameraTransform: `translate(${500 - lastCorrectNodeCoords.x}px, ${800 - lastCorrectNodeCoords.y}px) scale(1)`,
                    nodeCoords: { ...lastCorrectNodeCoords },
                    stageIndex: i
                });
                lastCorrectNodeCoords = { x: nextX, y: nextY };
                currentStageIndex = i + 1;
            }
            renderFork(lastCorrectNodeCoords.x, lastCorrectNodeCoords.y, currentStageIndex);
            updateNodeStates();
            setCameraTransform(500 - lastCorrectNodeCoords.x, 800 - lastCorrectNodeCoords.y, 1, false, false);
            lastCameraTransform = camera.style.transform;
            isPopupActive = false;
            updateGoBackButtonVisibility();
        }

        // Setup initial state
        document.getElementById('start-button').onclick = startGame;
        document.getElementById('begin-evolution-btn').onclick = beginEvolution;
        document.getElementById('restart-game-btn').onclick = () => location.reload();
        document.getElementById('go-back-btn').onclick = goBack;

        // Start the background lineages on load
        initBackgroundAnimation();
    </script>
</body>
